# 论文主要内容

## 题目
基于BERT-TextCNN 混合模型的多模态网络钓鱼攻击智能识别系统

## 摘要与关键词
摘要写作主线：面向中文网络钓鱼攻击识别任务，本文构建包含文本、URL与网络行为信息的多源数据处理流程，设计融合BERT全局语义表示与TextCNN局部n-gram特征的BERT‑TextCNN混合识别模型，并实现支持多模态信息输入、解析、记录、预警和可视化分析的智能识别系统。实验结果表明，在固定数据划分和三随机种子设置下，增强版BERT‑TextCNN模型取得较高检测性能（F1=0.9938±0.0003，FNR=0.0068±0.0008），相比强BERT基线进一步降低漏报率。系统层面形成检测—预警—记录—管理闭环，具备可复现性和实际应用价值。

关键词建议：网络钓鱼；BERT；TextCNN；混合模型；多源信息；智能识别系统；漏报率

## Abstract
英文摘要对应中文摘要，重点说明：phishing detection scenario, multisource information processing, BERT-TextCNN hybrid model, intelligent detection system, comparative experiments, practical deployment value。

---

## 第一章 绪论
1.1 研究背景：说明网络钓鱼攻击在短信、邮件、URL链接等场景中的表现形式，强调中文语境下钓鱼文本隐蔽性强、变体多、危害大。

1.2 研究意义：从用户资产安全、平台风控、自动化检测、降低漏报风险四个角度说明研究价值。注意突出“漏报率”在安全场景中的业务意义。

1.3 国内外研究现状：按传统机器学习、深度学习、预训练语言模型、多模态/多源信息检测系统四类综述。多模态部分要写成“有潜力但依赖特征质量和融合稳定性”，不要写成本文已经证明多模态融合一定更优。

1.4 研究内容：本文研究内容包括多源数据处理、BERT‑TextCNN核心模型设计、系统实现、对比实验与消融分析。

1.5 创新点建议：
- 构建面向中文网络钓鱼任务的文本、URL、网络行为多源信息处理流程。
- 提出增强版BERT‑TextCNN混合模型，将BERT `[CLS]` 全局语义与TextCNN局部n-gram特征进行融合。
- 实现支持多模态信息输入、特征记录、检测预警和模型管理的智能识别系统。

1.6 论文结构：概述第二章至第七章安排。

---

## 第二章 相关理论与技术基础
2.1 网络钓鱼攻击基础：介绍钓鱼攻击定义、攻击链路、常见载体（短信、邮件、恶意URL、仿冒页面）。

2.2 多源信息特征：说明文本语义信息、URL结构信息、网络行为信息。正文中使用“多源信息/多模态信息处理”，避免把当前系统描述成“部署了多模态神经融合模型”。

2.3 文本表示与分类模型：介绍TF‑IDF、TextCNN、LSTM、BERT的原理、优缺点和适用场景。

2.4 BERT‑TextCNN混合建模思想：说明BERT擅长全局语义理解，TextCNN擅长局部关键词/短语模式捕获，二者互补。

2.5 系统开发技术：FastAPI、Vue3、Element Plus、SQLAlchemy、ECharts、PyTorch、Transformers。

2.6 评价指标：Accuracy、Precision、Recall、F1、AUC、FPR、FNR。重点说明FNR代表漏报率，网络钓鱼检测中漏报比普通误差更敏感。

---

## 第三章 中文网络钓鱼多模态数据集构建
3.1 数据集构建目标：构建支持模型训练、消融实验和系统展示的中文网络钓鱼多源数据集。

3.2 数据来源与样本筛选：说明钓鱼样本、正常样本来源，描述去重、清洗、异常样本过滤和标签规范。若引用CPMD命名，需要解释其含义和规模。

3.3 文本预处理：包括空值处理、文本标准化、长度统计、标签编码、训练/验证/测试划分。

3.4 URL特征提取：说明URL长度、HTTPS、域名点数、敏感关键词等结构化特征，用于辅助分析和消融，不作为当前部署神经融合模型输入。

3.5 网络行为信息整理：说明响应状态、重定向、表单、敏感字段等网络行为维度；同时强调系统默认关闭在线探测，避免对用户URL发起不受控访问。

3.6 数据集划分与可复现：使用固定划分和随机种子，保证对比实验可复现。可引用 `scripts/experiment/data_split.py`、`docs/reports/dataset_building_guide.md` 和 `docs/reproducibility_and_feasibility.md`。

---

## 第四章 BERT-TextCNN混合模型设计与优化
4.1 模型设计目标：在强BERT基线基础上进一步提升识别稳定性，尤其关注召回率和漏报率。

4.2 总体结构：核心模型为增强版BERT‑TextCNN。BERT输出 `last_hidden_state`，其中 `[CLS]` 表示进入全局语义分支；完整token序列进入TextCNN分支提取局部n-gram模式；两路特征拼接后进入分类层。

4.3 BERT全局语义分支：说明 `[CLS]` 表示经过线性层、BatchNorm、ReLU得到全局语义向量。

4.4 TextCNN局部特征分支：说明2/3/4-gram卷积核捕获局部关键词组合和短语模式，适合识别钓鱼话术中的局部触发词。

4.5 特征融合与分类：说明全局语义向量与局部卷积向量拼接后分类，采用交叉熵训练。

4.6 训练策略：说明固定随机种子、balanced训练配置、早停、权重衰减、梯度累积、worker子进程隔离和checkpoint续跑。

4.7 多模态消融说明：保留多模态融合模型作为实验对照，但正式部署模型采用BERT‑TextCNN。原因是当前URL/网络行为特征质量与覆盖率不足，直接深度融合未稳定提升性能。

可引用代码：`src/core/models/model_definitions.py`、`scripts/experiment/models.py`、`scripts/experiment/run_experiment.py`。

---

## 第五章 钓鱼多模态智能识别系统开发
5.1 系统需求分析：包括单样本检测、批量检测、URL信息解析、检测记录、预警管理、模型管理、性能展示等需求。

5.2 系统总体架构：采用前端交互层、后端服务层、模型推理层、数据存储层四层结构。生产推理入口为 `src/service_layer/app.py` 与 `src/inference_layer/inference_service.py`。

5.3 前端设计：Vue3 + Element Plus。包括首页、单样本检测、批量检测、预警中心、模型管理、增量训练、性能数据、技术亮点等页面。

5.4 后端服务设计：FastAPI提供检测、批量检测、模型管理、训练任务、系统统计、备份等API。

5.5 推理服务设计：系统接收文本和URL，生成URL特征、网络行为特征和多源信息摘要；核心分类由BERT‑TextCNN完成；规则检测作为兜底和工程风险校准。

5.6 数据存储设计：使用SQLAlchemy保存检测记录、URL特征、网络行为特征、预警信息、模型版本和训练日志。

5.7 安全与落地设计：默认关闭在线网络探测，避免SSRF风险；模型权重加载尽量使用安全参数；备份和模型管理接口仅建议在可信环境中开放。

可引用代码：`frontend/src/views/SingleDetection.vue`、`frontend/src/views/BatchDetection.vue`、`src/service_layer/api/detection.py`、`src/inference_layer/inference_service.py`、`src/data_layer/models.py`。

---

## 第六章 实验验证与结果分析
6.1 实验环境：说明硬件、Python、PyTorch、Transformers、数据集版本、训练配置。

6.2 实验设置：固定数据划分，三随机种子（42/123/456），评价指标包括Accuracy、Precision、Recall、F1、FPR、FNR、AUC。

6.3 基线模型对比：TF‑IDF+LR、TextCNN、LSTM、BERT等结果来自 `output/experiments/formal_20260425_merged_feasible/summary.json`。

6.4 增强版BERT‑TextCNN结果：主模型结果来自 `output/experiments/formal_20260501_rescued_hybrid/summary.json`。核心结论：F1=0.9938±0.0003，FNR=0.0068±0.0008。

6.5 与BERT基线对比：BERT已接近性能天花板，BERT‑TextCNN提升幅度较小，但在F1和FNR方向更优；应强调安全场景中漏报率降低的实际意义。

6.6 多模态消融分析：`Multimodal-text_only`、`Multimodal-text_url`等结果未稳定提升，说明当前特征质量、覆盖率和融合训练稳定性不足。该部分作为局限和后续工作，不作为主贡献。

6.7 系统功能验证：说明前端构建、后端语法检查、URL-only检测、批量CSV检测、记录落库和预警流程。

可引用文件：`output/experiments/formal_20260501_rescued_hybrid/rescued_hybrid_conclusion.md`、`docs/reproducibility_and_feasibility.md`。

---

## 第七章 总结与展望
7.1 工作总结：总结多源数据构建、BERT‑TextCNN模型、智能识别系统和实验验证。

7.2 研究创新点：
- 面向中文网络钓鱼任务构建多源信息处理流程。
- 设计增强版BERT‑TextCNN混合模型，实现全局语义和局部n-gram模式融合。
- 实现支持多模态信息处理、检测预警、记录管理和可视化分析的智能识别系统。

7.3 不足分析：多模态融合模型尚未稳定优于文本主模型；真实网络行为特征覆盖率和质量仍需提高；系统缺少完整权限控制；在线探测需要更严格安全策略。

7.4 未来展望：提升URL/网络行为特征质量，引入更稳健的跨模态融合策略；补充权限认证、审计日志和部署监控；扩展真实场景数据和在线增量学习能力。

